<!DOCTYPE html>
<html lang="fr">
<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2f8f4e;font-family:"Trebuchet MS",system-ui,sans-serif;color:#2b2b2b;touch-action:manipulation}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#top{background:#fff8e1;border-bottom:4px solid #f4a259;padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:15px}
#top .chip{background:#fff;border:2px solid #f4a259;border-radius:14px;padding:3px 9px;white-space:nowrap}
#top .sp{flex:1}
.ib{background:#f4a259;color:#fff;border:0;border-radius:14px;font-size:16px;font-weight:700;padding:5px 11px;box-shadow:0 3px 0 #c97a30}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.grid .btn{flex:1 1 140px}
#evl{background:#fff3c4;padding:3px 10px;font-size:12px;font-weight:700;border-bottom:2px solid #e9c46a;min-height:20px}
#tourbar{position:absolute;left:8px;right:62px;bottom:8px;display:none;gap:6px;align-items:center;background:#fff8e1ee;border:3px solid #f4a259;border-radius:16px;padding:6px 8px;z-index:4;font-weight:700;font-size:14px}
#tourbar.show{display:flex}
#tourbar span{flex:1}
.ib.on{background:#3a9d5d;box-shadow:0 3px 0 #27703f}
#obj{cursor:pointer}
a{color:#1d6fb8;font-weight:700}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #c97a30}
#obj{background:#ffe9a8;padding:5px 10px;font-size:13px;font-weight:700;border-bottom:3px solid #e9c46a;min-height:28px}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bar{background:#fff8e1;border-top:4px solid #f4a259;display:flex;gap:5px;padding:6px;overflow-x:auto}
#bar button{flex:0 0 auto;min-width:62px;background:#fff;border:3px solid #f4a259;border-radius:14px;padding:4px 6px;font-size:12px;font-weight:700;line-height:1.15;color:#2b2b2b}
#bar button b{display:block;font-size:20px}
#bar button.on{background:#7ed957;border-color:#3a9d5d}
#zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:4}
#zoom .ib{width:42px;height:42px;padding:0;font-size:20px}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#2b2b2bdd;color:#fff;padding:8px 14px;border-radius:16px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;z-index:5}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#modal.show{display:flex}
#box{background:#fffaf0;border:5px solid #f4a259;border-radius:22px;max-width:460px;width:100%;max-height:88dvh;overflow-y:auto;padding:14px}
#box h2{margin:0 0 8px;font-size:20px}
#box h3{margin:12px 0 6px;font-size:15px}
.row{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #f0d9a8;border-radius:14px;padding:6px 8px;margin:5px 0;font-size:13px}
.row .g{flex:1;min-width:0}
.row img{width:46px;height:40px}
.bar{height:8px;border-radius:5px;background:#ddd;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%}
.btn{background:#3a9d5d;color:#fff;border:0;border-radius:12px;padding:7px 11px;font-weight:700;font-size:13px;box-shadow:0 3px 0 #27703f}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #27703f}
.btn.dis{background:#bbb;box-shadow:0 3px 0 #888}
.btn.red{background:#e76f51;box-shadow:0 3px 0 #b44a30}
.close{float:right}
input[type=range]{width:100%}
small{color:#666}
#cLvl{cursor:pointer}
#mini{inset:auto;left:8px;bottom:8px;width:100px;height:58px;background:#0005;border:2px solid #fff8;border-radius:10px;z-index:4;touch-action:none}
#tourbar.show~#mini{display:none}
</style>
</head>
<body>
<div id="top">
  <span class="chip" id="cMoney">💰 0</span>
  <span class="chip" id="cDay">📅 1</span>
  <span class="chip" id="cVis">👥 0</span>
  <span class="chip" id="cRate">⭐ 4.0</span>

</div>

<div id="stage"><canvas id="c"></canvas><div id="tourbar"><span id="tcap"></span><button class="btn" id="tNext">⏭</button><button class="btn red" id="tStop">✖ Arrêter</button></div><div id="zoom"><button class="ib" id="zIn">＋</button><button class="ib" id="zOut">－</button><button class="ib" id="zHome">🎯</button></div><div id="toast"></div><canvas id="mini" width="200" height="116"></canvas></div>
<div id="bar"></div>
<div id="modal"><div id="box"></div></div>

<script>
"use strict";
/* ============ DONNÉES ============ */
let COLS=16, ROWS=20, ENT={x:8,y:19};const DAY=40;
const SP=[
 {id:'compy',name:'Compsognathus',color:'#7ed957',cost:80,att:2,food:1,lvl:0,kind:'compy',mul:0.7},
 {id:'tric',name:'Tricératops',color:'#f4a259',cost:200,att:4,food:2,lvl:1,kind:'tric',mul:0.9},
 {id:'stego',name:'Stégosaure',color:'#5fb3b3',cost:300,att:5,food:2,lvl:2,kind:'stego',mul:0.95},
 {id:'bronto',name:'Brachiosaure',color:'#b48ead',cost:450,att:7,food:3,lvl:3,kind:'bronto',mul:0.85},
 {id:'raptor',name:'Vélociraptor',color:'#e76f51',cost:600,att:9,food:4,lvl:4,kind:'raptor',mul:0.8},
 {id:'rex',name:'T-Rex',color:'#4f9d69',cost:1000,att:14,food:6,lvl:5,kind:'rex',mul:1.0},
 {id:'anky',name:'Ankylosaure',color:'#c9a66b',cost:700,att:10,food:4,lvl:6,kind:'anky',mul:0.9},
 {id:'para',name:'Parasaurolophus',color:'#4d9de0',cost:850,att:11,food:4,lvl:7,kind:'para',mul:0.95},
 {id:'spino',name:'Spinosaure',color:'#2a9d8f',cost:1300,att:17,food:7,lvl:8,kind:'spino',mul:1.0}
];
const SPB={}; SP.forEach(s=>SPB[s.id]=s);
const LVL=[0,15,40,80,150,260,400,600,900];
const BT={
 path:{name:'Chemin',cost:10,icon:'🟫'},
 pen:{name:'Enclos',cost:200,w:2,h:2,icon:'🦖'},
 shop:{name:'Boutique',cost:150,inc:8,icon:'🛍️'},
 resto:{name:'Resto',cost:250,inc:15,icon:'🍔'},
 wc:{name:'WC',cost:100,icon:'🚻'},
 museum:{name:'Musée',cost:400,inc:6,icon:'🏛️'}
};
const PEN_CAP=3, FOOD_MAX=20, FOOD_COST=3, EGG_TIME=25, GROW_TIME=60, AUTO_COST=250;
const SAVE_KEY='dinoparc_v1';

/* ============ ÉTAT ============ */
let S, occ, reach=new Set(), dirtyFlag=true, visitors=[], floaters=[], tool=null, curPen=null;
const SAVE_KEY2='dinoparc_v2';
const PARK_KEYS=['money','day','t','visitors','rating','price','bld','objDone','dayInc','dayExp','id','lvl','log','dayVis','ev','nextEv','dig','pst'];
function newPark(mid){
  const m=MAPS[mid];
  const p={money:m.money,day:1,t:0,visitors:0,rating:4,price:10,bld:[],objDone:{},dayInc:0,dayExp:0,id:1,lvl:0,log:[],dayVis:0,ev:null,nextEv:null,dig:null,
    pst:{earned:0,hatched:0,fossils:0,sk:0,events:0}};
  for(let i=0;i<5;i++)p.bld.push({id:p.id++,type:'path',x:m.ent.x,y:m.ent.y-i,w:1,h:1});
  return p;
}
function newState(){
  const s={v:2,map:'prairie',parks:{},mapsDone:{},speed:1,maxLvl:0};
  return Object.assign(s,newPark('prairie'));
}
function pickPark(){const p={};for(const k of PARK_KEYS)p[k]=S[k];return p;}
function stashPark(){S.parks[S.map]=pickPark();}
function loadPark(mid){
  const p=S.parks[mid]||newPark(mid);
  S.map=mid;for(const k of PARK_KEYS)S[k]=p[k];
  delete S.parks[mid];
}
function serial(){
  const o={};for(const k in S)if(k!=='parks'&&!PARK_KEYS.includes(k))o[k]=S[k];
  o.parks=Object.assign({},S.parks);o.parks[S.map]=pickPark();return o;
}
function migrateV1(o){
  const s={};for(const k in o)s[k]=o[k];
  s.v=2;s.map='prairie';s.parks={};s.mapsDone=s.mapsDone||{};
  for(const b of s.bld){b.x+=4;b.y+=6;}
  s.objDone=null;delete s.obj;
  const st=s.st||{};
  s.pst={earned:st.earned||0,hatched:st.hatched||0,fossils:st.fossils||0,sk:st.sk||0,events:st.events||0};
  s.parks={prairie:Object.fromEntries(PARK_KEYS.map(k=>[k,s[k]]))};
  return s;
}
function load(){
  try{const r=localStorage.getItem(SAVE_KEY2);
    if(r){const o=JSON.parse(r);if(o&&o.parks&&MAPS[o.map]&&o.parks[o.map]&&Array.isArray(o.parks[o.map].bld))return o;}}catch(e){}
  try{const r=localStorage.getItem(SAVE_KEY);
    if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.bld))return migrateV1(o);}}catch(e){}
  return null;
}
function save(){ try{localStorage.setItem(SAVE_KEY2,JSON.stringify(serial()));}catch(e){} }
function bump(k){S.st[k]=(S.st[k]||0)+1;if(!S.pst)S.pst={};S.pst[k]=(S.pst[k]||0)+1;}
const lvNeed=i=>Math.round(LVL[i]*MAPS[S.map].lm);
function dexLevel(){return Math.max(level(),S.maxLvl||0);}

function rebuild(){
  occ=[]; for(let y=0;y<ROWS;y++){occ.push(new Array(COLS).fill(null));}
  for(const b of S.bld) for(let yy=b.y;yy<b.y+b.h;yy++) for(let xx=b.x;xx<b.x+b.w;xx++) occ[yy][xx]=b;
  // atteignable depuis l'entrée
  reach=new Set(); const q=[[ENT.x,ENT.y]]; reach.add(ENT.x+','+ENT.y);
  while(q.length){const [x,y]=q.shift(); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
    const o=occ[ny][nx]; if(!o||o.type!=='path')continue; const k=nx+','+ny; if(reach.has(k))continue; reach.add(k); q.push([nx,ny]);}}
  for(const [dx,dy] of DECO)occ[dy][dx]={type:'deco',x:dx,y:dy,w:1,h:1};
  dirtyFlag=false;
}
function isPath(x,y){return x>=0&&y>=0&&x<COLS&&y<ROWS&&occ[y][x]&&occ[y][x].type==='path';}
function adjReachable(b){
  for(let yy=b.y-1;yy<=b.y+b.h;yy++) for(let xx=b.x-1;xx<=b.x+b.w;xx++){
    const inside=xx>=b.x&&xx<b.x+b.w&&yy>=b.y&&yy<b.y+b.h; if(inside)continue;
    if((xx<b.x||xx>=b.x+b.w)&&(yy<b.y||yy>=b.y+b.h))continue; // pas les diagonales
    if(reach.has(xx+','+yy)) return true;
  } return false;
}
const pens=()=>S.bld.filter(b=>b.type==='pen');
const count=t=>S.bld.filter(b=>b.type===t).length;
function dinosCount(){let n=0;for(const p of pens())for(const d of p.dinos)if(!d.egg)n++;return n;}
function level(){const cap=MAPS[S.map].cap;let l=0;for(let i=0;i<LVL.length&&i<=cap;i++)if(S.visitors>=lvNeed(i))l=i;return l;}

/* ============ CARTES ET OBJECTIFS ============ */
const MAP_IDS=['prairie','jungle','desert','island'];
const MAPS={
 prairie:{name:'Prairie',ico:'🌿',cols:16,rows:20,ent:{x:8,y:19},cap:3,lm:1,money:600,wx:[0.65,0.9],theme:'prairie',
  water:[[1,1],[2,1],[1,2]],blocks:[['volcano',13,2]],desc:'Une grande prairie avec une mare et un petit volcan. Pour commencer tranquillement.'},
 jungle:{name:'Jungle',ico:'🌴',cols:18,rows:22,ent:{x:9,y:21},cap:5,lm:0.7,money:800,wx:[0.45,0.8],theme:'jungle',
  water:[[4,0],[4,1],[4,2],[5,3],[5,4],[5,5],[6,6],[13,4],[14,4],[15,4],[13,5],[14,5],[14,6]],blocks:[],desc:'Forêt dense, une rivière et un lac. Il pleut souvent.'},
 desert:{name:'Désert et canyon',ico:'🏜️',cols:20,rows:24,ent:{x:10,y:23},cap:7,lm:0.5,money:1000,wx:[0.92,0.98],theme:'desert',
  water:[[14,13],[15,13],[14,14],[15,14],[15,15]],blocks:[['mesa',2,2],['mesa',17,3],['mesa',3,11],['mesa',16,19]],desc:'Sable, cactus et falaises rouges, avec une oasis. Il pleut très rarement.'},
 island:{name:'Île volcanique',ico:'🌋',cols:22,rows:26,ent:{x:11,y:25},cap:8,lm:0.35,money:1200,wx:[0.6,0.88],theme:'island',
  water:[[15,11],[16,11],[15,12],[16,12],[17,12],[16,13]],blocks:[['volcano',4,4]],desc:'Une île entourée par la mer, avec un volcan et un lagon. La plus grande carte.'}
};
const ps=k=>(S.pst&&S.pst[k])||0;
function speciesN(){const s=new Set();for(const p of pens())for(const d of p.dinos)if(!d.egg)s.add(d.sp);return s.size;}
const hasSp=id=>pens().some(p=>p.dinos.some(d=>!d.egg&&d.sp===id));
const maxDeco=()=>pens().reduce((m,p)=>Math.max(m,(p.deco||[]).length),0);
const MAPOBJ={
 prairie:[
  {id:'pen',req:1,r:100,t:"Construis un enclos 🦖 (bouton Enclos, puis touche l'herbe à côté du chemin)",ok:()=>pens().length>=1},
  {id:'egg',req:1,r:100,t:"Achète un œuf 🥚 et attends sa naissance",ok:()=>ps('hatched')>=1},
  {id:'conn',req:1,r:100,t:"Relie un enclos à l'entrée avec des chemins",ok:()=>pens().some(adjReachable)},
  {id:'v30',req:1,r:200,t:"Accueille 30 visiteurs",ok:()=>S.visitors>=30},
  {id:'shop',req:1,r:150,t:"Construis une boutique 🛍️ le long du chemin",ok:()=>count('shop')>=1},
  {id:'d4',req:1,r:250,t:"Aie 4 dinosaures",ok:()=>dinosCount()>=4},
  {id:'deco2',r:150,t:"Décore un enclos avec 2 éléments 🌳",ok:()=>maxDeco()>=2},
  {id:'sp2',r:200,t:"Aie 2 espèces différentes",ok:()=>speciesN()>=2},
  {id:'wc',r:100,t:"Construis des WC 🚻",ok:()=>count('wc')>=1},
  {id:'rate',r:250,t:"Atteins la note de 4,3 ⭐",ok:()=>S.rating>=4.3},
  {id:'earn',r:300,t:"Gagne 1 500$ au total sur cette carte",ok:()=>ps('earned')>=1500}
 ],
 jungle:[
  {id:'v60',req:1,r:300,t:"Accueille 60 visiteurs",ok:()=>S.visitors>=60},
  {id:'sp3',req:1,r:300,t:"Aie 3 espèces différentes",ok:()=>speciesN()>=3},
  {id:'d6',req:1,r:300,t:"Aie 6 dinosaures",ok:()=>dinosCount()>=6},
  {id:'rw',req:1,r:300,t:"Construis un restaurant 🍔 et des WC 🚻",ok:()=>count('resto')>=1&&count('wc')>=1},
  {id:'mus',req:1,r:300,t:"Construis un musée 🏛️ le long du chemin",ok:()=>count('museum')>=1},
  {id:'fos3',req:1,r:300,t:"Trouve 3 fossiles ⛏️ sur cette carte",ok:()=>ps('fossils')>=3},
  {id:'sk',r:400,t:"Complète un squelette 🦴",ok:()=>ps('sk')>=1},
  {id:'deco3',r:300,t:"Décore un enclos avec 3 éléments 🌳",ok:()=>maxDeco()>=3},
  {id:'rate',r:400,t:"Atteins la note de 4,3 ⭐",ok:()=>S.rating>=4.3},
  {id:'earn',r:500,t:"Gagne 3 000$ au total sur cette carte",ok:()=>ps('earned')>=3000},
  {id:'rex',r:500,t:"Débloque le T-Rex (réputation 6)",ok:()=>level()>=5}
 ],
 desert:[
  {id:'v100',req:1,r:400,t:"Accueille 100 visiteurs",ok:()=>S.visitors>=100},
  {id:'d8',req:1,r:400,t:"Aie 8 dinosaures",ok:()=>dinosCount()>=8},
  {id:'sp4',req:1,r:400,t:"Aie 4 espèces différentes",ok:()=>speciesN()>=4},
  {id:'sk',req:1,r:500,t:"Complète un squelette 🦴 sur cette carte",ok:()=>ps('sk')>=1},
  {id:'all4',req:1,r:500,t:"Construis une boutique, un restaurant, des WC et un musée",ok:()=>['shop','resto','wc','museum'].every(t=>count(t)>=1)},
  {id:'rate',req:1,r:500,t:"Atteins la note de 4,2 ⭐",ok:()=>S.rating>=4.2},
  {id:'ev2',r:400,t:"Vis 2 événements dans le parc 🎉",ok:()=>ps('events')>=2},
  {id:'d12',r:500,t:"Aie 12 dinosaures",ok:()=>dinosCount()>=12},
  {id:'earn',r:600,t:"Gagne 5 000$ au total sur cette carte",ok:()=>ps('earned')>=5000},
  {id:'sk2',r:600,t:"Complète 2 squelettes 🦴 sur cette carte",ok:()=>ps('sk')>=2},
  {id:'para',r:600,t:"Débloque le Parasaurolophus (réputation 8)",ok:()=>level()>=7}
 ],
 island:[
  {id:'v150',req:1,r:500,t:"Accueille 150 visiteurs",ok:()=>S.visitors>=150},
  {id:'d10',req:1,r:500,t:"Aie 10 dinosaures",ok:()=>dinosCount()>=10},
  {id:'spino',req:1,r:800,t:"Élève un Spinosaure adulte ou bébé (pas un œuf)",ok:()=>hasSp('spino')},
  {id:'sk3',req:1,r:700,t:"Complète 3 squelettes 🦴 sur cette carte",ok:()=>ps('sk')>=3},
  {id:'rate',req:1,r:600,t:"Atteins la note de 4,5 ⭐",ok:()=>S.rating>=4.5},
  {id:'musc',req:1,r:500,t:"Aie un musée relié à l'entrée 🏛️",ok:()=>S.bld.some(b=>b.type==='museum'&&adjReachable(b))},
  {id:'d15',r:700,t:"Aie 15 dinosaures",ok:()=>dinosCount()>=15},
  {id:'earn',r:800,t:"Gagne 8 000$ au total sur cette carte",ok:()=>ps('earned')>=8000},
  {id:'sp7',r:800,t:"Aie 7 espèces différentes",ok:()=>speciesN()>=7},
  {id:'ev3',r:600,t:"Vis 3 événements dans le parc 🎉",ok:()=>ps('events')>=3},
  {id:'decoall',r:800,t:"Aie au moins 3 enclos, tous décorés avec 2 éléments ou plus",ok:()=>{const a=pens();return a.length>=3&&a.every(p=>(p.deco||[]).length>=2);}}
 ]
};
function mapProg(id){
  const od=(id===S.map?S.objDone:(S.parks[id]&&S.parks[id].objDone))||{};
  let rd=0,rn=0,bd=0,bn=0;
  for(const o of MAPOBJ[id]){if(o.req){rn++;if(od[o.id])rd++;}else{bn++;if(od[o.id])bd++;}}
  return {rd,rn,bd,bn};
}
function calcStars(p){
  if(p.rd<p.rn)return 0;
  let s=1;if(p.bn&&p.bd>=Math.ceil(p.bn/2))s++;if(p.bd>=p.bn)s++;return s;
}
const mapStars=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);
let objAcc=0,mapDonePending=false;
function checkObjectives(silent){
  const list=MAPOBJ[S.map];if(!list)return;
  if(S.objDone===null||S.objDone===undefined){S.objDone={};silent=true;}
  let changed=false;
  for(const o of list){
    if(S.objDone[o.id])continue;
    let ok=false;try{ok=o.ok();}catch(e){}
    if(ok){S.objDone[o.id]=S.day;changed=true;
      if(!silent){S.money+=o.r;toast((o.req?'✅ Objectif réussi':'⭐ Bonus réussi')+' ! +'+o.r+'$');snd('obj');}}
  }
  const st=calcStars(mapProg(S.map)),prev=S.mapsDone[S.map];
  if(st>0){
    if(!prev){S.mapsDone[S.map]={stars:st,day:S.day};changed=true;
      if(!silent){if(modal.classList.contains('show'))mapDonePending=true;else showMapDone();}}
    else if(st>prev.stars){prev.stars=st;changed=true;if(!silent){toast('🌟 '+MAPS[S.map].name+' : '+st+' étoiles !');fireworks();}}
  }
  if(changed)save();
}

/* ============ OUTILS UI ============ */
const $=id=>document.getElementById(id);
let toastT=0;
function toast(m){if(/Pas assez|pas libre|ne se démolissent|reste en place/.test(m))snd('error');else if(/Objectif/.test(m))snd('obj');else if(/Jour \d+ termin/.test(m))snd('chime');const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function earn(a,x,y){S.money+=a;S.dayInc+=a;if(S.st){S.st.earned+=a;if(S.pst)S.pst.earned=(S.pst.earned||0)+a;}if(x!=null){floaters.push({x,y,z:0.6,txt:'+'+a+'$',life:1.2,col:'#ffe066'});burst(x,y,0.5,3,'coin',['#ffd166']);snd('coin');}}
function spend(a){S.money-=a;S.dayExp+=a;}
function fmt(n){return Math.floor(n).toLocaleString('fr-CH').replace(/ /g,' ');}

function buildBar(){
  const bar=$('bar'); bar.innerHTML='';
  const mk=(id,ico,label)=>{const b=document.createElement('button');b.dataset.t=id;b.innerHTML='<b>'+ico+'</b>'+label;if(tool===id)b.className='on';bar.appendChild(b);};
  mk('none','✋','Voir');mk('undo','↩️','Annuler');
  for(const k of ['path','pen','shop','resto','wc','museum']) mk(k,BT[k].icon,BT[k].name+'<br>'+BT[k].cost+'$');
  mk('dig','⛏️','Fouilles');mk('del','🧹','Démolir');
}
$('bar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;snd('click');
  if(b.dataset.t==='undo'){undo();return;}
  if(b.dataset.t==='dig'){openDig();return;}
  const t=b.dataset.t; tool=(t==='none'||tool===t)?null:t; buildBar();
  if(tool&&tool!=='del') toast(BT[tool].name+' : touche la carte pour placer');
  if(tool==='del') toast('Touche un élément pour le démolir (50% remboursé)');
});

/* ============ CONSTRUCTION ============ */
function canPlace(type,x,y){
  const d=BT[type],w=d.w||1,h=d.h||1;
  if(x<0||y<0||x+w>COLS||y+h>ROWS)return false;
  for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(occ[yy][xx])return false;
  return true;
}
function place(type,x,y){
  const d=BT[type];
  if(!canPlace(type,x,y)){toast("Cette place n'est pas libre");return;}
  if(S.money<d.cost){toast("Pas assez d'argent 💸");return;}
  spend(d.cost);snd('build');
  const b={id:S.id++,type,x,y,w:d.w||1,h:d.h||1};
  if(type==='pen'){b.dinos=[];b.food=FOOD_MAX;b.auto=false;}
  S.bld.push(b); rebuild(); save();pushUndo({k:'add',b,cost:d.cost});
}
function demolish(x,y){
  const b=occ[y]&&occ[y][x]; if(!b||!BT[b.type])return;
  if(b.type==='pen'){toast("Les enclos ne se démolissent pas 🦖");return;}
  if(b.type==='path'&&b.x===ENT.x&&b.y===ENT.y){toast("L'entrée reste en place");return;}
  S.money+=Math.floor(BT[b.type].cost/2);pushUndo({k:'del',b,ref:Math.floor(BT[b.type].cost/2)});
  S.bld.splice(S.bld.indexOf(b),1);snd('demolish'); rebuild(); save();
}

/* ============ COULEURS / DESSIN DINO ============ */
function hex2rgb(h){const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255];}
function shade(hex,amt){
  const [r,g,b]=hex2rgb(hex).map(v=>Math.max(0,Math.min(255,v+amt)));
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
function mix(h1,h2,t){const a=hex2rgb(h1),b=hex2rgb(h2);return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';}
function lin(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g;}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);}
function eye(c,x,y,r,o,col){
  if(o.blink){c.lineWidth=0.06;c.beginPath();c.moveTo(x-r,y);c.lineTo(x+r,y);c.stroke();return;}
  c.fillStyle='#fff';ell(c,x,y,r,r*1.05);c.fill();c.lineWidth=0.045;c.stroke();
  c.fillStyle=col||'#3b2a1a';ell(c,x+r*0.25,y,r*0.62,r*0.7);c.fill();
  c.fillStyle='#111';ell(c,x+r*0.3,y,r*0.32,r*0.5);c.fill();
  c.fillStyle='#fff';ell(c,x+r*0.05,y-r*0.3,r*0.2,r*0.2);c.fill();
  if(o.sad){c.lineWidth=0.06;c.strokeStyle='#26323a';c.beginPath();c.moveTo(x-r*1.1,y-r*1.1);c.lineTo(x+r*0.9,y-r*1.6);c.stroke();}
  if(o.angry){c.lineWidth=0.08;c.strokeStyle='#26323a';c.beginPath();c.moveTo(x-r*1.1,y-r*1.5);c.lineTo(x+r*1.0,y-r*0.9);c.stroke();}
}
function mouth(c,x,y,w,o){
  c.lineWidth=0.055;c.strokeStyle='#26323a';
  if(o.eat){c.fillStyle='#7a1f2b';ell(c,x,y+0.04,w*0.5,0.09+Math.abs(Math.sin(o.ph*7))*0.07);c.fill();c.stroke();return;}
  c.beginPath();
  if(o.sad)c.arc(x,y+w*0.5,w*0.5,Math.PI*1.15,Math.PI*1.85);
  else c.arc(x,y-w*0.15,w*0.55,Math.PI*0.12,Math.PI*0.75);
  c.stroke();
}
// o: {ph, walk, eat, hap, blink}
function drawDino(c,x,y,sz,sp,dir,ph,o){
  o=Object.assign({walk:true,eat:false,hap:100,blink:false},o||{});o.ph=ph;
  o.sad=o.hap<40;
  c.save();c.translate(x,y);c.scale(sz*dir,sz);
  const col=sp.color,dk=shade(col,-55),md=shade(col,-22),lt=shade(col,48),k=sp.kind;
  const wk=o.walk?1:0.15,sw=Math.sin(ph*2)*0.2*wk,sw2=-sw;
  c.translate(0,Math.sin(ph*4)*0.025*wk+(o.eat?0.03:0));
  c.lineJoin='round';c.lineCap='round';c.lineWidth=0.07;c.strokeStyle='#26323a';
  const wag=Math.sin(ph*1.3)*0.16;
  const tailLen={compy:2.3,tric:1.9,stego:2.0,bronto:2.5,raptor:2.7,rex:2.3,anky:2.0,para:2.3,spino:2.6}[k];
  const ry={compy:0.5,tric:0.72,stego:0.7,bronto:0.78,raptor:0.5,rex:0.78,anky:0.62,para:0.7,spino:0.7}[k];
  const rx=k==='bronto'?1.15:k==='anky'?1.12:1;
  // ---- queue
  c.fillStyle=lin(c,-1,-0.5,-tailLen,0.4,[[0,md],[1,dk]]);
  c.beginPath();c.moveTo(-0.7,-ry*0.7);
  c.bezierCurveTo(-1.5,-ry*0.8+wag*0.4,-tailLen+0.3,-0.2+wag,-tailLen,(k==='raptor'?-0.45:0.1)+wag);
  c.bezierCurveTo(-tailLen+0.5,0.4+wag*0.5,-1.4,ry*0.7,-0.6,ry*0.55);c.closePath();c.fill();c.stroke();
  if(k==='anky'){c.fillStyle=md;ell(c,-tailLen+0.1,0.1+wag,0.3,0.24);c.fill();c.stroke();c.fillStyle=lt;ell(c,-tailLen,0.05+wag,0.1,0.08);c.fill();}
  if(k==='stego'){c.fillStyle='#f7b538';for(let i=0;i<3;i++){const px=-tailLen+0.35+i*0.38,py=0.1+wag*(1-i*0.25);
    c.beginPath();c.moveTo(px,py-0.05);c.lineTo(px-0.1,py-0.45);c.lineTo(px+0.15,py-0.08);c.closePath();c.fill();c.stroke();}}
  // ---- plaques (derrière le corps)
  if(k==='stego'){for(let i=0;i<6;i++){const px=-0.8+i*0.34,h=0.55+Math.sin(i*0.6+0.3)*0.28;
    c.fillStyle=lin(c,px,-ry-h,px,-ry,[[0,'#ffd166'],[1,'#e76f51']]);
    c.beginPath();c.moveTo(px-0.2,-ry+0.1);c.quadraticCurveTo(px-0.12,-ry-h*0.9,px,-ry-h);c.quadraticCurveTo(px+0.15,-ry-h*0.7,px+0.22,-ry+0.1);c.closePath();c.fill();c.stroke();}}
  if(k==='spino'){c.fillStyle=lin(c,0,-ry-0.9,0,-ry,[[0,'#f4845f'],[1,'#b5443a']]);c.beginPath();c.moveTo(-0.75,-ry+0.15);c.bezierCurveTo(-0.6,-ry-0.9,0.0,-ry-1.1,0.7,-ry+0.1);c.closePath();c.fill();c.stroke();c.strokeStyle='rgba(60,20,20,0.55)';c.lineWidth=0.05;for(let i=0;i<5;i++){const px=-0.5+i*0.28;c.beginPath();c.moveTo(px,-ry+0.1);c.lineTo(px+0.05,-ry-0.55-Math.sin(i*0.7+0.5)*0.2);c.stroke();}c.strokeStyle='#26323a';c.lineWidth=0.07;}
  // ---- pattes éloignées
  const legY=ry*0.85,lw=k==='bronto'?0.24:0.18,lh=k==='bronto'?0.5:0.38;
  c.fillStyle=dk;
  for(const lx of [-0.15+sw2*0.6,0.62+sw*0.6]){ell(c,lx,legY+lh*0.45,lw,lh);c.fill();c.stroke();ell(c,lx+0.08,legY+lh*0.95,lw*1.3,0.09);c.fill();}
  // ---- cou long (brachio)
  let hx={compy:1.0,tric:1.3,stego:1.45,bronto:1.8,raptor:1.35,rex:1.25,anky:1.3,para:1.35,spino:1.6}[k];
  let hy={compy:-0.55,tric:-0.35,stego:-0.15,bronto:-2.15,raptor:-0.7,rex:-0.75,anky:-0.1,para:-0.6,spino:-0.55}[k];
  const dip=o.eat?(0.22+Math.sin(ph*7)*0.06):0;
  if(k==='bronto'){hy+=dip*3;hx+=dip*1.2;}else hy+=dip;
  if(k==='bronto'){
    c.fillStyle=lin(c,0.4,0,1.4,-2,[[0,col],[1,lt]]);
    c.beginPath();c.moveTo(0.5,-0.5);c.bezierCurveTo(0.9,-1.0,0.85+dip*1.2,-1.7+dip*2,hx-0.4,hy+0.2);
    c.lineTo(hx-0.05,hy-0.2);c.bezierCurveTo(hx-0.15,-1.6+dip*2,1.5,-1.0,1.2,-0.1);c.closePath();c.fill();c.stroke();
  }
  // ---- corps
  c.fillStyle=lin(c,0,-ry,0,ry,[[0,md],[0.45,col],[1,lt]]);
  ell(c,0,0,rx,ry);c.fill();
  c.save();ell(c,0,0,rx,ry);c.clip();
  if(k==='bronto'||k==='compy'||k==='tric'){c.fillStyle=shade(col,-30);c.globalAlpha=0.55;
    for(const [a,b,r] of [[-0.5,-0.2,0.16],[0.1,-0.35,0.2],[0.55,-0.1,0.14],[-0.1,0.15,0.13],[-0.7,0.2,0.11]]){ell(c,a,b,r,r);c.fill();}c.globalAlpha=1;}
  if(k==='raptor'||k==='rex'||k==='stego'){c.strokeStyle=dk;c.globalAlpha=0.55;c.lineWidth=0.12;
    for(let i=0;i<5;i++){c.beginPath();c.moveTo(-0.8+i*0.4,-ry);c.quadraticCurveTo(-0.7+i*0.4,-0.1,-0.85+i*0.4,ry*0.35);c.stroke();}c.globalAlpha=1;}
  c.restore();
  c.strokeStyle='#26323a';c.lineWidth=0.07;ell(c,0,0,rx,ry);c.stroke();
  if(k==='anky'){c.fillStyle=dk;for(let r=0;r<2;r++)for(let i=0;i<6;i++){ell(c,-0.75+i*0.3,-ry*0.55+r*0.28,0.13,0.09);c.fill();c.stroke();}}

  for(const lx of [-0.62+sw*0.7,0.3+sw2*0.7]){ell(c,lx,legY+lh*0.45,lw*1.1,lh);c.fill();c.stroke();

  // ---- tête
  c.save();c.translate(hx,hy);
  if(k==='rex'){
    // mâchoire inférieure
    c.fillStyle=md;c.beginPath();c.moveTo(-0.45,0.1);c.lineTo(0.75,0.18+(o.eat?0.22:0));c.lineTo(0.7,0.4+(o.eat?0.22:0));c.lineTo(-0.3,0.45);c.closePath();c.fill();c.stroke();
    c.fillStyle=lin(c,0,-0.6,0,0.2,[[0,md],[1,lt]]);ell(c,0.1,-0.15,0.68,0.46,-0.08);c.fill();c.stroke();
    c.fillStyle='#fffbe8';for(let i=0;i<4;i++){c.beginPath();c.moveTo(0.1+i*0.15,0.2);c.lineTo(0.17+i*0.15,0.38);c.lineTo(0.24+i*0.15,0.2);c.fill();}
    c.fillStyle=dk;ell(c,0.72,-0.28,0.04,0.05);c.fill();
    eye(c,0.2,-0.3,0.14,Object.assign({},o,{angry:!o.sad&&true}),'#c9a227');
    c.strokeStyle='#26323a';c.lineWidth=0.05;c.beginPath();c.moveTo(0.35,0.12);c.quadraticCurveTo(0.55,0.2,0.68,0.12);c.stroke();
  }else if(k==='tric'){
    c.fillStyle=lin(c,-0.4,-1,0.2,0.2,[[0,dk],[1,md]]);ell(c,-0.15,-0.2,0.7,0.78);c.fill();c.stroke();
    c.fillStyle=lt;for(let i=0;i<7;i++){const a=-Math.PI*0.95+i*0.4;ell(c,-0.15+Math.cos(a)*0.62,-0.2+Math.sin(a)*0.68,0.07,0.07);c.fill();}
    c.fillStyle=lin(c,0,-0.4,0,0.4,[[0,col],[1,lt]]);ell(c,0.1,0.0,0.55,0.38);c.fill();c.stroke();
    c.fillStyle='#e9d8a6';c.beginPath();c.moveTo(0.45,-0.05);c.lineTo(0.85,0.12);c.lineTo(0.45,0.28);c.closePath();c.fill();c.stroke();
    c.fillStyle='#fff6d6';
    for(const [bx,by,tx,ty] of [[0.05,-0.3,0.55,-0.95],[0.25,-0.28,0.85,-0.7]]){c.beginPath();c.moveTo(bx-0.07,by);c.lineTo(tx,ty);c.lineTo(bx+0.1,by+0.02);c.closePath();c.fill();c.stroke();}
    c.beginPath();c.moveTo(0.58,-0.08);c.lineTo(0.78,-0.34);c.lineTo(0.7,-0.02);c.closePath();c.fill();c.stroke();
    eye(c,0.2,-0.15,0.11,o);
  }else if(k==='stego'){
    c.fillStyle=lin(c,0,-0.3,0,0.3,[[0,col],[1,lt]]);ell(c,0,0,0.42,0.27,0.18);c.fill();c.stroke();
    c.fillStyle='#e9d8a6';c.beginPath();c.moveTo(0.28,-0.05);c.lineTo(0.55,0.08);c.lineTo(0.25,0.18);c.closePath();c.fill();c.stroke();

    c.fillStyle='#e9d8a6';ell(c,0.38,0.08,0.15,0.1);c.fill();

    c.strokeStyle=dk;c.lineWidth=0.14;c.beginPath();c.moveTo(0.05,-0.22);c.bezierCurveTo(-0.3,-0.8,-0.95,-0.75,-1.15,-0.25);c.stroke();

  }else if(k==='spino'){
    c.fillStyle=lin(c,0,-0.3,0,0.3,[[0,md],[1,lt]]);ell(c,0.25,-0.02,0.8,0.26,-0.06);c.fill();c.stroke();
    c.fillStyle='#fffbe8';for(let i=0;i<5;i++){c.beginPath();c.moveTo(0.2+i*0.12,0.18);c.lineTo(0.25+i*0.12,0.3);c.lineTo(0.3+i*0.12,0.18);c.fill();}
    c.fillStyle='#e76f51';c.beginPath();c.moveTo(-0.3,-0.2);c.quadraticCurveTo(-0.15,-0.5,0.1,-0.25);c.closePath();c.fill();c.stroke();
    eye(c,0.0,-0.12,0.1,o);
  }else{ // compy
    c.fillStyle=lin(c,0,-0.4,0,0.4,[[0,md],[1,lt]]);ell(c,0.05,0,0.5,0.4,0.1);c.fill();c.stroke();

    if(!o.sad&&!o.eat){c.fillStyle='#ff9aa2';c.globalAlpha=0.7;ell(c,0.0,0.12,0.09,0.06);c.fill();c.globalAlpha=1;}
  }
  mouth(c,k==='rex'?0.45:k==='raptor'?0.35:k==='tric'?0.5:k==='bronto'?0.18:0.35,k==='rex'?0.05:k==='tric'?0.15:k==='raptor'?0.07:0.15,k==='compy'||k==='stego'?0.16:0.25,o);

function drawEgg(c,x,y,sz,sp,wob,crack){
  c.save();c.translate(x,y);c.rotate(wob);c.scale(sz,sz);

  c.save();ell(c,0,0,0.55,0.75);c.clip();c.fillStyle=sp.color;c.globalAlpha=0.8;

  c.restore();
  if(crack){c.lineWidth=0.06;c.beginPath();c.moveTo(-0.45,-0.1);c.lineTo(-0.2,-0.25);c.lineTo(0,-0.05);c.lineTo(0.2,-0.28);c.lineTo(0.45,-0.1);c.stroke();}

function addEgg(pen,sp){
  pen.dinos.push({sp:sp.id,egg:EGG_TIME,age:0,hap:100,x:0.4+Math.random()*1.2,y:0.7+Math.random()*0.9,tx:0,ty:0,dir:1,ph:Math.random()*6,wait:0});
}
function penFoodUse(pen){let u=0;for(const d of pen.dinos)if(!d.egg)u+=SPB[d.sp].food;return u;}
function attraction(){
  let a=0;const kinds=new Set();
  for(const p of pens()){ if(!adjReachable(p))continue;
    const cm=1+comfort(p);
    for(const d of p.dinos){if(d.egg)continue;a+=SPB[d.sp].att*(0.5+0.5*d.age)*(d.hap/100)*cm;kinds.add(d.sp);} }
  return a+kinds.size*1+museumBonus();
}
const VCOL=['#e63946','#457b9d','#f4a259','#9b5de5','#2a9d8f','#f15bb5','#fee440'];
function bfs(sx,sy,goal){
  const key=(x,y)=>y*COLS+x,prev=new Map(),q=[[sx,sy]];prev.set(key(sx,sy),null);
  while(q.length){const [x,y]=q.shift();
    if(goal(x,y)){const out=[];let k=key(x,y);while(k!==null&&prev.get(k)!==null){out.push([k%COLS,Math.floor(k/COLS)]);k=prev.get(k);}return out.reverse();}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;
      if(!isPath(nx,ny))continue;const kk=key(nx,ny);if(prev.has(kk))continue;prev.set(kk,key(x,y));q.push([nx,ny]);}}
  return null;
}
function spawnVisitor(){
  // destinations atteignables
  const cands=[];
  for(const b of S.bld){
    if(b.type==='path')continue;
    if(b.type==='pen'&&!b.dinos.some(d=>!d.egg))continue;
    if(b.type==='museum'&&fossilCount()===0)continue;
    if(!adjReachable(b))continue;
    const w=b.type==='pen'?3:b.type==='museum'?2:1; for(let i=0;i<w;i++)cands.push(b);
  }
  if(!cands.length)return;
  const n=2+Math.floor(Math.random()*3), route=[];
  for(let i=0;i<n*3&&route.length<n;i++){const b=cands[Math.floor(Math.random()*cands.length)];if(!route.includes(b))route.push(b);}
  earn(S.price,ENT.x+0.5,ENT.y+0.5); S.visitors++;S.dayVis=(S.dayVis||0)+1;
  visitors.push({x:ENT.x,y:ENT.y,jx:(Math.random()-0.5)*0.4,jy:(Math.random()-0.5)*0.3,path:[],route,ri:0,state:'plan',tstay:0,mood:3,col:VCOL[Math.floor(Math.random()*VCOL.length)],ph:Math.random()*6,seen:0,wc:false});
}
function planNext(v){
  while(v.ri<v.route.length){
    const b=v.route[v.ri];
    if(!S.bld.includes(b)){v.ri++;continue;}
    const p=bfs(Math.round(v.x),Math.round(v.y),(x,y)=>{
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&occ[ny][nx]===b)return true;}return false;});
    if(p){v.path=p;v.state='walk';v.dest=b;return;}
    v.ri++;
  }
  const p=bfs(Math.round(v.x),Math.round(v.y),(x,y)=>x===ENT.x&&y===ENT.y);
  v.path=p||[];v.state='leave';v.dest=null;
}
function arrive(v){
  const b=v.dest;v.state='stay';v.tstay=2+Math.random()*2;
  const cx=b.x+b.w/2,cy=b.y+b.h/2;
  if(b.type==='pen'){
    const ds=b.dinos.filter(d=>!d.egg);let q=ds.length?ds.reduce((s,d)=>s+d.hap,0)/ds.length/100:0;
    v.mood=Math.min(5,v.mood+0.4+q*0.9+(b.deco||[]).length*0.08);v.seen++;floaters.push({x:cx,y:cy,z:1.0,txt:q>0.5?'😍':'😐',life:1.4,col:'#fff'});
  }else if(b.type==='shop'){earn(Math.round(BT.shop.inc*evMul()),cx,cy);v.mood=Math.min(5,v.mood+0.3);}
  else if(b.type==='resto'){earn(Math.round(BT.resto.inc*evMul()),cx,cy);v.mood=Math.min(5,v.mood+0.5);}
  else if(b.type==='museum'){earn(BT.museum.inc,cx,cy);v.mood=Math.min(5,v.mood+0.5+Math.min(0.5,skeletons()*0.1));floaters.push({x:cx,y:cy,z:1.0,txt:'🦴',life:1.3,col:'#fff'});}
  else if(b.type==='wc'){v.wc=true;v.mood=Math.min(5,v.mood+0.4);floaters.push({x:cx,y:cy,z:1.0,txt:'😌',life:1.2,col:'#fff'});}
}
function updVisitor(v,dt){
  v.ph+=dt*8;
  if(v.state==='plan'){planNext(v);return;}
  if(v.state==='stay'){v.tstay-=dt;if(v.tstay<=0){v.ri++;v.state='plan';}return;}
  // marche
  let step=2.2*dt;
  while(step>0&&v.path.length){
    const [tx,ty]=v.path[0];
    if(!isPath(tx,ty)){v.state='gone';return;}
    const dx=tx-v.x,dy=ty-v.y,dist=Math.hypot(dx,dy);
    if(dist<=step){v.x=tx;v.y=ty;v.path.shift();step-=dist;}
    else{v.x+=dx/dist*step;v.y+=dy/dist*step;step=0;}
  }
  if(!v.path.length){
    if(v.state==='walk')arrive(v);
    else if(v.state==='leave'){
      let m=v.mood;
      if(S.price>25)m-=0.5; if(S.price>35)m-=0.7;
      if(!v.wc&&v.seen>=2&&count('wc')===0)m-=0.7;
      m=Math.max(0,Math.min(5,m));S.rating+=(m-S.rating)*0.08;v.state='gone';
    }
  }
}

function dayEnd(){
  const net=S.dayInc-S.dayExp;
  toast('Jour '+S.day+' terminé · visiteurs '+(S.dayVis||0)+' · recettes '+fmt(S.dayInc)+'$ · dépenses '+fmt(S.dayExp)+'$ · '+(net>=0?'+':'')+fmt(net)+'$');
  if(!S.log)S.log=[];S.log.push({d:S.day,inc:S.dayInc,exp:S.dayExp,v:S.dayVis||0});if(S.log.length>14)S.log.shift();
  S.ev=null;S.day++;S.dayInc=0;S.dayExp=0;S.dayVis=0;rollWeather();dayStartEvents();save();
  try{localStorage.setItem('dinoparc_backup',JSON.stringify(serial()));}catch(e){}
}
function update(dt){
  ambientTick(dt);
  if(dirtyFlag)rebuild();
  S.t+=dt;if(S.t>=DAY){S.t-=DAY;dayEnd();}
  digTick(dt);
  // enclos
  for(const p of pens()){
    const use=penFoodUse(p)/DAY;p.food=Math.max(0,p.food-use*dt);
    if(p.auto&&p.food<5&&use>0){const need=Math.ceil(FOOD_MAX-p.food),cost=need*FOOD_COST;if(S.money>=cost){spend(cost);p.food=FOOD_MAX;}}
    for(const d of p.dinos){
      const sp=SPB[d.sp];d.ph+=dt*4;
      if(d.egg){d.egg-=dt;if(d.egg<=0){d.egg=0;d.age=0;d.hap=100;toast('🐣 '+sp.name+' est né !');bump('hatched');snd('hatch');setTimeout(()=>snd('roar',sp.kind),700);floaters.push({x:p.x+d.x,y:p.y+d.y,z:0.8,txt:'🐣',life:1.5,col:'#fff'});burst(p.x+d.x,p.y+d.y,0.3,26,'conf',['#ef476f','#ffd166','#06d6a0','#118ab2','#9b5de5']);}continue;}
      d.age=Math.min(1,d.age+dt/GROW_TIME);if(d.hap>80&&Math.random()<0.02*dt)burst(p.x+d.x,p.y+d.y,0.5,1,'heart',['#f00']);
      if(p.food<=0)d.hap=Math.max(0,d.hap-2.5*dt*(1-Math.min(0.6,(p.deco||[]).length*0.15)));else d.hap=Math.min(100,d.hap+3*dt);
      // déplacement
      if(d.wait>0){d.wait-=dt;}
      else{
        if(!d.tx&&!d.ty){d.tx=0.35+Math.random()*1.3;d.ty=0.7+Math.random()*0.9;}
        const dx=d.tx-d.x,dy=d.ty-d.y,dist=Math.hypot(dx,dy),sp2=0.35*dt;
        if(dist<=sp2){d.x=d.tx;d.y=d.ty;d.tx=d.ty=0;d.wait=1+Math.random()*3;d.eating=p.food>0&&Math.random()<0.55;}
        else{d.x+=dx/dist*sp2;d.y+=dy/dist*sp2;if(Math.abs(dx-dy)>0.02)d.dir=(dx-dy)>0?1:-1;}
      }
    }
  }
  // visiteurs
  const att=attraction();
  const pf=Math.max(0.15,Math.min(1.2,1.4-S.price/30)),rf=0.6+S.rating/5*0.6;
  const wf=wx==='storm'?0.3:wx==='rain'?0.6:1,nf=nightLevel()>0.7?0.5:1;
  const rate=att>0?(0.04+att*0.04)*pf*rf*wf*nf*(S.ev&&S.ev.k==='school'?2:1):0;
  if(visitors.length<40&&Math.random()<rate*dt)spawnVisitor();
  for(const v of visitors)updVisitor(v,dt);
  visitors=visitors.filter(v=>v.state!=='gone');
  for(const f of floaters){f.life-=dt;}
  floaters=floaters.filter(f=>f.life>0);
  // niveau / objectifs
  const l=level();
  if(l>S.lvl){S.lvl=l;fireworks();snd('level');toast('🎉 Réputation '+(l+1)+' ! '+(SP[l]?SP[l].name+' débloqué':''));}
  if(l>(S.maxLvl||0))S.maxLvl=l;
  objAcc+=dt;if(objAcc>0.5){objAcc=0;checkObjectives(false);}
}

const SND={ctx:null,master:null,sfx:null,mus:null,rainG:null,rainSrc:null,nextNote:0,step:0,lastCoin:0,lastBird:0,lastRoar:0,ok:true};
function sndOpts(){if(!S.snd)S.snd={sfx:true,music:true};return S.snd;}
function audioInit(){
  if(SND.ctx){if(SND.ctx.state==='suspended')SND.ctx.resume();return;}
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC){SND.ok=false;return;}
    const c=SND.ctx=new AC();
    SND.master=c.createGain();SND.master.gain.value=0.8;
    const comp=c.createDynamicsCompressor();SND.master.connect(comp);comp.connect(c.destination);
    SND.sfx=c.createGain();SND.sfx.connect(SND.master);
    SND.mus=c.createGain();SND.mus.gain.value=0.5;SND.mus.connect(SND.master);
    // bruit de pluie en boucle
    const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    SND.noiseBuf=buf;
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=3500;f.Q.value=0.6;
    SND.rainG=c.createGain();SND.rainG.gain.value=0;src.connect(f);f.connect(SND.rainG);SND.rainG.connect(SND.master);src.start();
    SND.nextNote=c.currentTime+0.3;
  }catch(e){SND.ok=false;}
}
function sOn(){return SND.ctx&&SND.ok&&sndOpts().sfx;}
function tone(f0,dur,type,vol,f1,delay,dest){
  if(!SND.ctx)return;const c=SND.ctx,t=c.currentTime+(delay||0);
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||SND.sfx);o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,vol,freq,q,delay,type){
  if(!SND.ctx)return;const c=SND.ctx,t=c.currentTime+(delay||0);
  const s=c.createBufferSource();s.buffer=SND.noiseBuf;const f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq||1000;f.Q.value=q||1;
  const g=c.createGain();g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(SND.sfx);s.start(t,Math.random()*1.5);s.stop(t+dur+0.05);
}

const PENTA=[0,2,4,7,9];
function noteHz(deg,oct){return 220*Math.pow(2,(PENTA[((deg%5)+5)%5]+12*(oct+Math.floor(deg/5)))/12);}
function musicTick(){
  if(!SND.ctx||!SND.ok||!sndOpts().music)return;const c=SND.ctx;
  while(SND.nextNote<c.currentTime+0.6){
    const t=SND.nextNote-c.currentTime,st=SND.step++,night=nightLevel()>0.5,bpm=night?70:92,beat=60/bpm;
    const chord=[0,3,4,2][Math.floor(st/8)%4];
    if(st%8===0){for(const d of [chord,chord+2,chord+4])tone(noteHz(d,0),beat*7.6,'sine',0.045,null,t,SND.mus);}
    if(st%2===0||Math.random()<0.4){const d=chord+[0,2,4,5,7][Math.floor(Math.random()*5)];
      if(Math.random()<0.75)tone(noteHz(d,1),beat*1.4,night?'sine':'triangle',night?0.05:0.06,null,t,SND.mus);}
    SND.nextNote+=beat/2;
  }
}
function ambientTick(dt){
  if(!SND.ctx||!SND.ok)return;
  if(SND.rainG){const target=sndOpts().sfx?(wx==='storm'?0.22:wx==='rain'?0.12:0):0;SND.rainG.gain.value+=(target-SND.rainG.gain.value)*Math.min(1,dt*2);}
  if(!sndOpts().sfx)return;
  const n=nightLevel();
  if(wx==='clear'&&n<0.4&&Math.random()<dt*0.28)SFX.bird();
  if(n>0.6&&wx==='clear'&&Math.random()<dt*0.5)SFX.cricket();
  if(Math.random()<dt*0.12){
    const all=[];for(const p of pens())for(const d of p.dinos)if(!d.egg)all.push(d);
    if(all.length)SFX.roar(SPB[all[Math.floor(Math.random()*all.length)].sp].kind);
  }
}

function applyMap(id){
  const m=MAPS[id];COLS=m.cols;ROWS=m.rows;ENT={x:m.ent.x,y:m.ent.y};THM=THEMES[m.theme];
  WATER=m.water.map(a=>a.slice());VOLS=[];MESAS=[];DECO=WATER.map(a=>a.slice());
  for(const [k,cx,cy] of m.blocks){(k==='volcano'?VOLS:MESAS).push({x:cx,y:cy});for(const dx of [-1,0])for(const dy of [-1,0])DECO.push([cx+dx,cy+dy]);}
  decorList=[];const dk=new Set(DECO.map(a=>a[0]+','+a[1]));
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(dk.has(x+','+y))continue;
    if(Math.abs(x-ENT.x)<=2&&y>=ENT.y-6)continue;
    if(hash(x*1.7+3,y*2.3+1)<THM.dens)decorList.push({x,y,type:THM.trees[Math.floor(hash(y,x)*THM.trees.length)]});
  }
}

function nightLevel(){

function drawTree(c,x,y,type){

function updateFx(dt){

  parts=parts.filter(p=>p.life>0);if(parts.length>400)parts.splice(0,parts.length-400);

const ptrs=new Map();let tapStart=null,pinch0=null,moved=false,lastDragTile='';

const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;};
function tileAt(cx,cy){const r=cv.getBoundingClientRect();const [x,y]=unP(cx-r.left,cy-r.top);return [Math.floor(x),Math.floor(y)];}

cv.addEventListener('pointerdown',e=>{
  if(tour&&tour.mode!=='ret')stopTour();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){tapStart={x:e.clientX,y:e.clientY};moved=false;lastDragTile='';}
  else{pinch0={d:pdist(),z:cam.z};moved=true;}

cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;

      if(tool==='path'){const [x,y]=tileAt(tapStart.x,tapStart.y);lastDragTile=x+','+y;if(canPlace('path',x,y))place('path',x,y);}}
    if(moved){

      else{cam.fx+=(-dx*2/TW-dy*2/TH)/2;cam.fy+=(-dy*2/TH+dx*2/TW)/2;clampCam();}

function endPtr(e){

  const [x,y]=tileAt(cx,cy);

const undoStack=[];
function pushUndo(u){undoStack.push(u);if(undoStack.length>30)undoStack.shift();}
function undo(){
  const u=undoStack.pop();if(!u){toast("Rien à annuler");return;}
  if(u.k==='add'){
    if(!S.bld.includes(u.b))return undo();
    if(u.b.type==='pen'&&u.b.dinos.length){toast("Cet enclos contient des dinos : impossible de l'annuler");return;}
    S.bld.splice(S.bld.indexOf(u.b),1);S.money+=u.cost;S.dayExp=Math.max(0,S.dayExp-u.cost);
    rebuild();save();toast("↩️ Construction annulée (remboursée)");
  }else{
    for(let yy=u.b.y;yy<u.b.y+u.b.h;yy++)for(let xx=u.b.x;xx<u.b.x+u.b.w;xx++)if(occ[yy][xx]){toast("La place est prise, impossible d'annuler");return;}
    if(S.money<u.ref){toast("Pas assez d'argent 💸");undoStack.push(u);return;}
    S.money-=u.ref;S.bld.push(u.b);rebuild();save();toast("↩️ Démolition annulée");
  }
}

function speciesOwned(){const k=new Set();for(const p of pens())for(const d of p.dinos)if(!d.egg)k.add(d.sp);return k.size;}
function startDig(i){
  if(S.dig){toast("Une équipe est déjà en fouille");return;}
  const s=SITES[i];if(S.money<s.cost){toast("Pas assez d'argent 💸");return;}
  spend(s.cost);S.dig={site:i,t:s.dur,total:s.dur};snd("build");save();
}
function digTick(dt){
  if(!S.dig)return;S.dig.t-=dt;
  if(S.dig.t<=0){const site=SITES[S.dig.site];S.dig=null;finishDig(site);}
}
function finishDig(site){
  const lv=level(),avail=SP.filter(s=>s.lvl<=lv);
  const w=avail.map((s,i)=>1+site.bias*(avail.length>1?i/(avail.length-1):0));
  let r=Math.random()*w.reduce((a,b)=>a+b,0),idx=0;for(;idx<w.length-1&&r>w[idx];idx++)r-=w[idx];
  const sp=avail[idx],part=Math.floor(Math.random()*3);
  if(!S.fossils[sp.id])S.fossils[sp.id]=[false,false,false];
  const arr=S.fossils[sp.id];
  if(arr[part]){earn(25);toast("🦴 Doublon ("+PARTS[part]+" de "+sp.name+") : vendu 25$");}
  else{arr[part]=true;bump('fossils');snd("hatch");
    if(arr.every(Boolean)){bump('sk');toast("🦖 Squelette complet : "+sp.name+" !");fireworks();}
    else toast("🦴 Fossile trouvé : "+PARTS[part]+" de "+sp.name+" — retrouve-le dans la collection");}
  save();
}

/* ---- sauvegarde ---- */
function exportJSON(){S.st.exp++;return JSON.stringify({format:"dino-parc",version:2,date:new Date().toISOString(),state:serial()});}
function applyState(o){
  if(o&&o.state)o=o.state;
  let n;
  if(o&&o.parks&&MAPS[o.map]&&o.parks[o.map]&&Array.isArray(o.parks[o.map].bld))n=o;
  else if(o&&Array.isArray(o.bld)&&typeof o.money==="number")n=migrateV1(o);
  else throw new Error("format");
  S=n;loadPark(S.map);fixState();enterMap();save();
}
function openSave(){modalKind="save";modal.classList.add("show");renderSave();}
let confirmImp=false;
function renderSave(){
  let h=closeBtn()+'<button class="btn" data-a="menu">← Menu</button><h2>💾 Sauvegarde</h2>';
  h+='<div class="row"><div class="g"><b>Sauvegarde automatique</b><br><small>Le jeu se sauvegarde tout seul sur cet appareil, et garde une copie de secours à chaque fin de jour.</small></div></div>';
  h+="<h3>Exporter</h3><small>Garde ce texte ou ce fichier pour retrouver ta partie plus tard, ou la copier sur un autre téléphone.</small>";
  h+='<div class="grid"><button class="btn" data-a="svdl">📥 Télécharger un fichier</button><button class="btn" data-a="svcopy">📋 Copier le texte</button></div>';
  h+="<h3>Importer</h3><small>Choisis un fichier, ou colle le texte, puis touche Importer.</small>";
  h+='<input type="file" id="svfile" accept=".json,application/json" style="margin:6px 0;width:100%">';
  h+='<textarea id="svtxt" rows="4" style="width:100%;font-size:12px;border-radius:10px;border:2px solid #f0d9a8;padding:6px" placeholder="Le texte de sauvegarde apparaît ici"></textarea>';
  h+='<div class="grid"><button class="btn red" data-a="svimp">Importer (remplace la partie actuelle)</button><button class="btn" data-a="svbak">↩️ Restaurer la copie de secours</button></div>';
  box.innerHTML=h;
  const f=$("svfile");if(f)f.addEventListener("change",()=>{const fl=f.files&&f.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{$("svtxt").value=String(r.result||"");};r.readAsText(fl);});
}
function svAction(a,b){
  const ta=$("svtxt");
  if(a==="svdl"||a==="svcopy"){
    const txt=exportJSON();if(ta)ta.value=txt;
    if(a==="svdl"){
      try{const bl=new Blob([txt],{type:"application/json"}),u=URL.createObjectURL(bl),l=document.createElement("a");l.href=u;l.download="dino-parc-jour"+S.day+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("📥 Fichier créé. S'il ne s'enregistre pas, copie le texte ci-dessous.");}
      catch(e){toast("Téléchargement impossible : copie le texte ci-dessous.");}
    }else{
      let ok=false;
      try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt);ok=true;}}catch(e){}
      if(!ok&&ta){ta.select();try{ok=document.execCommand("copy");}catch(e){}}
      toast(ok?"📋 Texte copié !":"Sélectionne le texte ci-dessous et copie-le.");
    }
    return true;
  }
  if(a==="svimp"){
    if(!confirmImp){confirmImp=true;b.textContent="Sûr ? Touche encore pour remplacer";setTimeout(()=>{confirmImp=false;if(modalKind==="save")b.textContent="Importer (remplace la partie actuelle)";},3500);return true;}
    confirmImp=false;
    try{applyState(JSON.parse(ta.value));toast("✅ Partie importée");closeModal();}
    catch(e){toast("Ce texte n'est pas une sauvegarde valide");}
    return true;
  }
  if(a==="svbak"){
    if(!confirmImp){confirmImp=true;b.textContent="Sûr ? Touche encore";setTimeout(()=>{confirmImp=false;},3500);return true;}
    confirmImp=false;
    try{const r=localStorage.getItem("dinoparc_backup");if(!r){toast("Pas encore de copie de secours (fin du premier jour)");return true;}applyState(JSON.parse(r));toast("✅ Copie de secours restaurée");closeModal();}
    catch(e){toast("Copie de secours illisible");}
    return true;
  }
  return false;
}

/* ---- tour du parc / suivre un dino ---- */
let tour=null;
function startTour(mode){
  if(mode==="follow"){tour={mode:"follow",f:null};pickFollow();if(!tour.f){tour=null;toast("Aucun dino à suivre pour l'instant");return;}}
  else{
    const stops=[{fx:ENT.x+0.5,fy:ENT.y-1,z:1.3,cap:"🚪 L'entrée du parc",dur:4.5}];
    for(const b of S.bld){
      if(b.type==="pen"){const names=[...new Set(b.dinos.filter(d=>!d.egg).map(d=>SPB[d.sp].name))];
        stops.push({fx:b.x+1,fy:b.y+1,z:1.7,cap:"🦖 Enclos"+(names.length?" : "+names.join(", "):" (vide)"),dur:5});}
      else if(b.type!=="path")stops.push({fx:b.x+0.5,fy:b.y+0.5,z:1.8,cap:BT[b.type].icon+" "+BT[b.type].name,dur:3.5});
    }
    tour={mode:"tour",stops,i:0,t:0};$("tcap").textContent=stops[0].cap;
  }
  S.st.tour++;$("tourbar").classList.add("show");
}
function pickFollow(){
  const all=[];for(const p of pens())for(const d of p.dinos)if(!d.egg)all.push({p,d});
  if(!all.length){tour.f=null;return;}
  tour.f=all[Math.floor(Math.random()*all.length)];
  $("tcap").textContent="🐾 Tu suis : "+SPB[tour.f.d.sp].name+(tour.f.d.age<1?" (bébé)":"");
}
function stopTour(){
  if(!tour||tour.mode==="ret")return;
  tour={mode:"ret",stops:[{fx:ENT.x+0.5,fy:ENT.y-3.5,z:1,cap:"",dur:1.8}],i:0,t:0};$("tourbar").classList.remove("show");
}
function tourTick(dt){
  if(!tour)return;let st;
  if(tour.mode==="follow"){
    const f=tour.f;if(!f||!S.bld.includes(f.p)||!f.p.dinos.includes(f.d)||f.d.egg){pickFollow();if(!tour||!tour.f){stopTour();}return;}
    st={fx:f.p.x+f.d.x,fy:f.p.y+f.d.y,z:2.0};
  }else{
    tour.t+=dt;st=tour.stops[tour.i];
    if(tour.t>=st.dur){tour.i++;tour.t=0;
      if(tour.i>=tour.stops.length){if(tour.mode==="ret"){tour=null;return;}stopTour();return;}
      if(tour.mode==="tour")$("tcap").textContent=tour.stops[tour.i].cap;}
    st=tour.stops[tour.i];
  }
  const k=1-Math.exp(-dt*(S.calm?1.2:2));
  cam.fx+=(st.fx-cam.fx)*k;cam.fy+=(st.fy-cam.fy)*k;cam.z+=(st.z-cam.z)*k;setScale();
}

/* ---- actions des fenêtres ---- */
function extAction(a,b){
  switch(a){
    case "menu":openMenu();return true;
    case "decor":if(curPen){addDecor(curPen,b.dataset.s);renderPen();}return true;
    case "undecor":if(curPen){removeDecor(curPen,+b.dataset.s);renderPen();}return true;
    case "quiz":startQuiz();return true;
    case "qa":answerQuiz(+b.dataset.k);return true;
    case "qnext":quiz.i++;quiz.sel=-1;renderQuiz();return true;
    case "qagain":startQuiz();return true;
    case "none":return true;
    case "maps":openMaps();return true;
    case "mapgo":switchMap(b.dataset.s);closeModal();return true;
    case "mapnext":switchMap(MAP_IDS[MAP_IDS.indexOf(S.map)+1]);closeModal();return true;
    case "mapstay":closeModal();return true;
    case "mapnew":{const id=b.dataset.s;
      if(mapConfirm!==id){mapConfirm=id;b.textContent="Sûr ? Touche encore";setTimeout(()=>{mapConfirm=null;if(modalKind==="maps")renderMaps();},3500);return true;}
      mapConfirm=null;resetMap(id);toast("🔄 "+MAPS[id].name+" recommence");renderMaps();return true;}
    case "ach":openAch();return true;
    case "col":openCol();return true;
    case "dig":openDig();return true;
    case "digsite":startDig(+b.dataset.s);renderDig();return true;
    case "tour":closeModal();startTour("tour");return true;
    case "follow":closeModal();startTour("follow");return true;
    case "sv":openSave();return true;
    case "svdl":case "svcopy":case "svimp":case "svbak":return svAction(a,b);
  }
  return false;
}

/* ============ CARTES : changement, fenêtres, minicarte ============ */
function enterMap(){
  applyMap(S.map);
  visitors=[];floaters=[];parts=[];sparks=[];tool=null;undoStack.length=0;wx='clear';flash=0;
  tour=null;$('tourbar').classList.remove('show');
  rebuild();ensureEvent(false);checkObjectives(true);buildBar();updateTop();homeCam();refreshSndBtn();refreshCalmBtn();
  if(!S.bld.some(b=>b.type==='pen'))setTimeout(()=>toast(MAPS[S.map].ico+' '+MAPS[S.map].name+' : construis ton premier enclos 🦖'),500);
}
function mapUnlocked(i){return i===0||!!S.mapsDone[MAP_IDS[i-1]];}
function switchMap(id){
  if(id===S.map)return;
  stashPark();loadPark(id);fixState();enterMap();save();
}
function resetMap(id){
  const p=newPark(id);
  if(id===S.map){for(const k of PARK_KEYS)S[k]=p[k];enterMap();}
  else S.parks[id]=p;
  save();
}
function openMaps(){modalKind='maps';modal.classList.add('show');renderMaps();}
let mapConfirm=null;
function renderMaps(){
  let h=closeBtn()+'<button class="btn" data-a="menu">← Menu</button><h2>🗺️ Cartes</h2>';
  h+='<small>Chaque carte a ses objectifs obligatoires et des objectifs bonus (⭐). Réussis les obligatoires pour ouvrir la carte suivante. Chaque carte repart de zéro ; succès, fossiles et quiz sont gardés.</small>';
  MAP_IDS.forEach((id,i)=>{
    const m=MAPS[id],un=mapUnlocked(i),cur=id===S.map,started=cur||!!S.parks[id],pr=mapProg(id),done=S.mapsDone[id];
    h+='<div class="row" style="'+(cur?'border-color:#3a9d5d;':'')+(un?'':'opacity:.6')+'"><span style="font-size:26px">'+(un?m.ico:'🔒')+'</span><div class="g"><b>'+m.name+'</b> <small>('+m.cols+'×'+m.rows+')</small><br><small>'+m.desc+'</small><br><small><b>'+
      (un?((started?'Obligatoires '+pr.rd+'/'+pr.rn+' · Bonus '+pr.bd+'/'+pr.bn:'Pas encore commencée')+(done?' · '+mapStars(done.stars):'')):'Réussis les objectifs obligatoires de '+MAPS[MAP_IDS[i-1]].name+' pour l\'ouvrir.')+'</b></small></div>';
    if(un){h+='<div style="display:flex;flex-direction:column;gap:4px">';
      h+=cur?'<small>Tu es ici</small>':'<button class="btn" data-a="mapgo" data-s="'+id+'">'+(started?'Continuer':'Jouer')+'</button>';
      if(started)h+='<button class="btn red" data-a="mapnew" data-s="'+id+'">Recommencer</button>';
      h+='</div>';}
    h+='</div>';});
  box.innerHTML=h;
}
function showMapDone(){
  const m=MAPS[S.map],st=S.mapsDone[S.map].stars,nx=MAP_IDS[MAP_IDS.indexOf(S.map)+1];
  fireworks();snd('level');modalKind='mapdone';modal.classList.add('show');
  let h='<h2>'+m.ico+' '+m.name+' réussie !</h2><div class="row"><div class="g" style="text-align:center"><span style="font-size:34px">'+mapStars(st)+'</span><br>Tous les objectifs obligatoires sont atteints.<br><small>Les étoiles supplémentaires viennent des objectifs bonus : tu peux rester dans ce parc pour les gagner.</small></div></div><div class="grid">';
  if(nx)h+='<button class="btn" data-a="mapnext">➡️ Carte suivante : '+MAPS[nx].name+'</button>';
  h+='<button class="btn" data-a="mapstay">Rester dans ce parc</button><button class="btn" data-a="maps">🗺️ Voir les cartes</button></div>';
  box.innerHTML=h;
}
const mini=$('mini'),mctx=mini.getContext('2d');
const MINI_COL={path:'#f1e2b5',pen:'#2e7d32',shop:'#ff9f1c',resto:'#e63946',wc:'#4d9de0',museum:'#9b5de5'};
function miniGeom(){const Wm=mini.width,Hm=mini.height,a=(Wm-8)/(COLS+ROWS);return {Wm,Hm,a,ox:4+ROWS*a,oy:(Hm-(COLS+ROWS)*a/2)/2};}
function miniDraw(){
  if(!S||!THM||modalKind)return;
  const c=mctx,{Wm,Hm,a,ox,oy}=miniGeom();c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,Wm,Hm);
  const MP=(x,y)=>[ox+(x-y)*a,oy+(x+y)*a/2];
  const dia=(x,y,w,h,col)=>{c.fillStyle=col;poly(c,[MP(x,y),MP(x+w,y),MP(x+w,y+h),MP(x,y+h)]);c.fill();};
  if(THM.sea){c.fillStyle='#4aa8dc';c.fillRect(0,0,Wm,Hm);}
  dia(0,0,COLS,ROWS,THM.mini);
  for(const [x,y] of WATER)dia(x,y,1,1,THM.water[1]);
  for(const v of VOLS)dia(v.x-1,v.y-1,2,2,'#8a5d3b');
  for(const v of MESAS)dia(v.x-1,v.y-1,2,2,'#c4703f');
  for(const b of S.bld)dia(b.x,b.y,b.w,b.h,MINI_COL[b.type]||'#fff');
  dia(ENT.x,ENT.y,1,1,'#ff3b30');
  c.strokeStyle='rgba(255,255,255,0.95)';c.lineWidth=2;c.beginPath();
  [[0,0],[W,0],[W,H],[0,H]].forEach((s,i)=>{const [x,y]=unP(s[0],s[1]),p=MP(clamp(x,0,COLS),clamp(y,0,ROWS));i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]);});
  c.closePath();c.stroke();
  c.strokeStyle='rgba(0,0,0,0.5)';c.lineWidth=1;poly(c,[MP(0,0),MP(COLS,0),MP(COLS,ROWS),MP(0,ROWS)]);c.stroke();
}
mini.addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();
  if(tour&&tour.mode!=='ret')stopTour();
  const r=mini.getBoundingClientRect(),{Wm,Hm,a,ox,oy}=miniGeom();
  const px=(e.clientX-r.left)/r.width*Wm,py=(e.clientY-r.top)/r.height*Hm;
  const u=(px-ox)/a,v=(py-oy)/(a/2);
  cam.fx=clamp((u+v)/2,0,COLS);cam.fy=clamp((v-u)/2,0,ROWS);
  miniDraw();
});

let modalKind=null,touching=false;
const modal=$('modal'),box=$('box');
function closeModal(){modal.classList.remove('show');modalKind=null;curPen=null;if(mapDonePending){mapDonePending=false;setTimeout(showMapDone,250);}}
modal.addEventListener('pointerdown',e=>{if(e.target===modal)closeModal();else touching=true;});
window.addEventListener('pointerup',()=>{setTimeout(()=>touching=false,50);});
window.addEventListener('pointercancel',()=>{touching=false;});

function openPen(b){snd('click');const al=b.dinos.filter(d=>!d.egg);if(al.length)snd('roar',SPB[al[Math.floor(Math.random()*al.length)].sp].kind);curPen=b;modalKind='pen';modal.classList.add('show');renderPen();}
function bar(pct,col){return '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,pct))+'%;background:'+col+'"></i></div>';}
function renderPen(){
  const b=curPen;if(!b)return;
  let h='<button class="btn red close" data-a="close">✖</button><h2>🦖 Enclos</h2>';
  h+='<div class="row"><div class="g"><b>🍖 Nourriture : '+Math.ceil(b.food)+' / '+FOOD_MAX+'</b>'+bar(b.food/FOOD_MAX*100,b.food>5?'#3a9d5d':'#e63946')+'<small>Consommation : '+penFoodUse(b)+' unités / jour</small></div>';
  const need=Math.ceil(FOOD_MAX-b.food);
  h+='<button class="btn'+(need<1||S.money<need*FOOD_COST?' dis':'')+'" data-a="feed">Nourrir<br>'+need*FOOD_COST+'$</button></div>';
  if(b.auto) h+='<div class="row"><div class="g">👩‍🌾 Soigneur automatique actif<br><small>Remplit la nourriture tout seul (au même prix).</small></div></div>';
  else h+='<div class="row"><div class="g">👩‍🌾 <b>Soigneur automatique</b><br><small>Remplit la nourriture tout seul.</small></div><button class="btn'+(S.money<AUTO_COST?' dis':'')+'" data-a="auto">'+AUTO_COST+'$</button></div>';
  h+=decorHTML(b);
  h+='<h3>Habitants ('+b.dinos.length+'/'+PEN_CAP+')</h3>';
  if(!b.dinos.length)h+='<small>Aucun dino pour l\'instant. Achète un œuf ci-dessous !</small>';
  b.dinos.forEach((d,i)=>{const sp=SPB[d.sp];
    h+='<div class="row"><img data-a="dex" data-s="'+sp.id+'" src="'+thumb(sp,!!d.egg)+'"><div class="g"><b>'+sp.name+'</b> '+(d.egg?'<small>🥚 couve</small>'+bar((1-d.egg/EGG_TIME)*100,'#f4a259'):'<small>'+(d.age>=1?'adulte':'bébé · '+Math.round(d.age*100)+'%')+'</small>')+
      (d.egg?'':'<br><small>Humeur</small>'+bar(d.hap,d.hap>50?'#3a9d5d':d.hap>25?'#f4a259':'#e63946'))+'</div></div>';});
  h+='<h3>🥚 Acheter un œuf</h3>';
  const lv=level(),full=b.dinos.length>=PEN_CAP;
  for(const sp of SP){const locked=sp.lvl>lv;
    h+='<div class="row"><img src="'+thumb(sp,true)+'"><div class="g"><b>'+sp.name+'</b><br><small>Attrait '+sp.att+' · mange '+sp.food+'/jour</small></div>';
    h+=locked?'<span>'+(sp.lvl>MAPS[S.map].cap?'🔒 Autre carte':'🔒 Rép. '+(sp.lvl+1))+'</span>':'<button class="btn'+(full||S.money<sp.cost?' dis':'')+'" data-a="egg" data-s="'+sp.id+'">'+sp.cost+'$</button>';
    h+='</div>';}
  box.innerHTML=h;
}
function openMenu(){
  modalKind='menu';modal.classList.add('show');renderMenu();
}
function renderMenu(){
  const att=attraction();
  let h='<button class="btn red close" data-a="close">✖</button><h2>⚙️ Direction du parc</h2>';
  h+='<div class="row"><div class="g"><b>🌿 Mode calme</b><br><small>Plus d\'orage ni de pluie, plus d\'éclairs, moins de particules et d\'animations, pas de feux d\'artifice. Les sons ne changent pas.</small></div><button class="btn'+(S.calm?'':' red')+'" data-a="calm">'+(S.calm?'Activé':'Coupé')+'</button></div>';
  h+='<div class="row"><div class="g"><b>📋 Repères</b><br><small>Objectifs de la carte, réputation, bilans des jours.</small></div><button class="btn" data-a="ref">Ouvrir</button></div>';
  h+='<h3>Explorer</h3><div class="grid">'+[['dex','📖 Dinopédia'],['quiz','🧠 Quiz'],['ach','🏆 Succès ('+Object.keys(S.ach||{}).length+'/'+ACH.length+')'],['col','🦴 Collection'],['tour','🎥 Tour du parc'],['follow','🐾 Suivre un dino'],['maps','🗺️ Cartes'],['sv','💾 Sauvegarde']].map(x=>'<button class="btn" data-a="'+x[0]+'" data-s="">'+x[1]+'</button>').join('')+'</div>';
  h+='<div class="row"><div class="g"><b>🎟️ Prix d\'entrée : <span id="pv">'+S.price+'</span>$</b><input type="range" min="5" max="40" step="1" value="'+S.price+'" id="pr"><small>Plus c\'est cher, moins il y a de visiteurs (et au-dessus de 25$ ils râlent).</small></div></div>';
  h+='<div class="row"><div class="g"><b>📈 Attrait du parc : '+att.toFixed(1)+'</b><br><small>Dinos adultes, heureux et reliés à l\'entrée = plus de visiteurs. Chaque espèce différente ajoute un bonus.</small></div></div>';
  h+='<div class="row"><div class="g"><b>⭐ Réputation '+(level()+1)+'</b><br><small>'+(level()<MAPS[S.map].cap?'Prochaine réputation à '+lvNeed(level()+1)+' visiteurs ('+S.visitors+' accueillis).':'Réputation maximum sur cette carte !')+'</small></div></div>';
  const so=sndOpts();h+='<div class="row"><div class="g"><b>🔊 Bruitages</b><br><small>Dinos, pièces, météo, ambiance.</small></div><button class="btn'+(so.sfx?'':' red')+'" data-a="tsfx">'+(so.sfx?'Activés':'Coupés')+'</button></div><div class="row"><div class="g"><b>🎵 Musique</b><br><small>Douce, change la nuit.</small></div><button class="btn'+(so.music?'':' red')+'" data-a="tmus">'+(so.music?'Activée':'Coupée')+'</button></div>';
  h+='<div class="row"><div class="g"><b>⏩ Vitesse</b></div><button class="btn" data-a="speed">x'+S.speed+' → suivante</button></div>';
  h+='<div class="row"><div class="g"><b>🔄 Nouvelle partie</b><br><small>Efface toute la sauvegarde (toutes les cartes).</small></div><button class="btn red" data-a="reset">Reset</button></div>';
  box.innerHTML=h;
  const pr=$('pr');if(pr)pr.addEventListener('input',()=>{S.price=+pr.value;$('pv').textContent=pr.value;});
}
box.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.classList.contains('dis'))return;
  const a=b.dataset.a;
  if(a==='dex'){openDex(b.dataset.s);return;}
  if(a==='back'){if(dexId){dexId=null;renderDex();}else if(dexFrom==='pen'&&curPen){openPen(curPen);}else if(dexFrom==='ref'){openRef();}else openMenu();return;}
  if(a==='ref'){openRef();return;}
  if(a==='calm'){setCalm(!S.calm);renderMenu();return;}
  if(extAction(a,b)){snd('click');return;}
  if(a==='feed')snd('feed');else if(a==='egg')snd('build');else if(a!=='tsfx'&&a!=='tmus')snd('click');
  if(a==='close')closeModal();
  else if(a==='feed'&&curPen){const need=Math.ceil(FOOD_MAX-curPen.food);spend(need*FOOD_COST);curPen.food=FOOD_MAX;renderPen();}
  else if(a==='auto'&&curPen){spend(AUTO_COST);curPen.auto=true;renderPen();}
  else if(a==='egg'&&curPen){const sp=SPB[b.dataset.s];if(curPen.dinos.length>=PEN_CAP||S.money<sp.cost)return;spend(sp.cost);addEgg(curPen,sp);toast('🥚 Œuf de '+sp.name+' placé !');save();renderPen();}
  else if(a==='tsfx'){const o=sndOpts();o.sfx=!o.sfx;refreshSndBtn();renderMenu();}
  else if(a==='tmus'){const o=sndOpts();o.music=!o.music;refreshSndBtn();renderMenu();}
  else if(a==='speed'){S.speed=S.speed>=3?1:S.speed+1;renderMenu();}
  else if(a==='reset'){if(confirmReset){try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(SAVE_KEY2);localStorage.removeItem('dinoparc_backup');}catch(_){}initGame(true);closeModal();}else{confirmReset=true;b.textContent='Sûr ? Retouche';setTimeout(()=>confirmReset=false,3000);}}
});
let confirmReset=false;
setInterval(()=>{if(touching)return;if(modalKind==='pen')renderPen();else if(modalKind==='dig')renderDig();},700);
$('bMenu').addEventListener('click',()=>{snd('click');openMenu();});
$('bSnd').addEventListener('click',()=>{const o=sndOpts(),on=o.sfx||o.music;o.sfx=o.music=!on;refreshSndBtn();if(!on)setTimeout(()=>snd('chime'),50);});
$('bSpeed').addEventListener('click',()=>{S.speed=S.speed>=3?1:S.speed+1;});

/* ============ DÉMARRAGE ============ */
function initGame(fresh){
  const o=fresh?null:load();
  if(o){S=o;loadPark(S.map);}else S=newState();
  fixState();if(S.calm)wx='clear';
  enterMap();
}
initGame(false);
resize();homeCam();
refreshSndBtn();refreshCalmBtn();
$('obj').addEventListener('click',openRef);
$('cLvl').addEventListener('click',()=>{snd('click');openMaps();});
setInterval(miniDraw,150);
$('tStop').addEventListener('click',stopTour);
$('tNext').addEventListener('click',()=>{if(!tour)return;if(tour.mode==='follow')pickFollow();else tour.t=999;});
setInterval(checkAch,1000);
$('bCalm').addEventListener('click',()=>{snd('click');setCalm(!S.calm);});
requestAnimationFrame(frame);
